name: Ekonomi haberlerini güncelle

on:
  schedule:
    # Her gün 07:23, 10:23, 13:23, 16:23, 19:23 ve 22:23 TSİ (UTC+3)
    - cron: '23 4,7,10,13,16,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Haberleri RSS'ten çek
        run: node _kaynak/haber-guncelle.js

      - name: Sayfaları yeniden üret
        run: node _kaynak/build.js

      - name: Değişiklikleri kaydet
        id: commit
        run: |
          if git diff --quiet; then
            echo "Değişiklik yok."
            echo "degisti=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "haber-guncelleyici"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ekonomi haberlerini güncelle ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
          git pull --rebase -X theirs origin main
          node _kaynak/build.js
          git add -A
          git diff --cached --quiet || git commit -m "Sayfaları yeniden üret"
          git push
          echo "degisti=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages yayınını tetikle
        if: steps.commit.outputs.degisti == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages yayını tetiklenemedi; bir sonraki push ile yayınlanacak."
